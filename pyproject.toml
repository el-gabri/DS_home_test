[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Real-time fraud detection for PIX transactions"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.8",
    "uvicorn~=0.34.0",
    "pydantic~=2.10.6",
    "pydantic-settings~=2.7.1",
    "joblib~=1.4.2",
    "pandas~=2.2.3",
    "numpy~=2.1.3",
    "scikit-learn~=1.6.1",
    "xgboost~=2.1.4",
    "imbalanced-learn~=0.13.0",
    "PyYAML~=6.0.2",
]

[project.optional-dependencies]
# Everything needed to run the notebooks / fraud_detection.train, on top of
# the serving dependencies above. Not installed in the Docker serving image.
dev = [
    "scipy~=1.15.1",
    "lightgbm~=4.5.0",
    "pyod~=2.0.3",
    "matplotlib~=3.10.0",
    "seaborn~=0.13.2",
    "optuna~=4.2.0",
    "plotly~=6.0.0",
    "statsmodels~=0.14.4",
    "pytest~=8.3.4",
    "httpx~=0.28.1",
    "ruff~=0.9.4",
    "mypy~=1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
